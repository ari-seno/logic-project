name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Link Vercel project
        run: bunx vercel link --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Pull production env
        run: bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build
        run: bunx vercel build --prod --token=$VERCEL_TOKEN
      - name: Deploy
        run: bunx vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN
